<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trending Movies</title>
    <!-- Bootstrap 5 CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet"
    />
</head>
<body class="bg-dark text-light min-vh-100 py-4">

    <div class="container">
        <!-- Page Header -->
        <header class="mb-4 text-center">
            <h1 class="fw-bold tracking-wide">Trending Movies</h1>
        </header>

        <!-- Movie Cards Grid (JavaScript will inject cards here) -->
        <div id="movies-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Dynamic movie cards go here -->
        </div>
    </div>

    <!-- Bootstrap JS (optional for simple grid/cards, but good practice) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
