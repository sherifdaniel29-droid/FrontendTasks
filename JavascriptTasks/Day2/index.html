<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Launch Animation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #e0e6ed;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        .sky-container {
            position: relative;
            width: 300px;
            height: 400px;
            background-color: #0d1b2a; 
            border-radius: 10px;
            overflow: hidden; 
            margin-bottom: 20px;
            border: 4px solid #1b263b;
        }

        #rocket {
            position: absolute;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%); 
            font-size: 50px; 
            transition: bottom 2s ease-in; 
        }
        .launched {
            bottom: 600px !important; 
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="sky-container">
        <div id="rocket">🚀</div>
    </div>

    <button onclick="launchRocket()">Launch Rocket!</button>

    <script>
        function launchRocket() {
            const rocket = document.getElementById('rocket');
            
            rocket.classList.add('launched');
            
            setTimeout(() => {
                rocket.classList.remove('launched');
            }, 4000);
        }
    </script>

</body>
</html>
